[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-wake"
version = "0.13.0"
description = "Durable Codex follow-ups, tracked agent exchanges and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Cochran Research Group" }
]
dependencies = [
  "dbus-next>=0.2.3,<0.3",
  "websockets>=17,<18",
]

[project.scripts]
codex-wake = "codex_wake.cli:main"
codex-waked = "codex_wake.daemon:main"
codex-wake-hook = "codex_wake.hook:main"
codex-wake-github-webhook = "codex_wake.webhook_listener:main"
codex-wake-mcp = "codex_wake.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2.2,<2.3", "jsonschema>=4.26,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_wake = ["time_collect.ps1"]
