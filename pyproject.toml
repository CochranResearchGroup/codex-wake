[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-wake"
version = "0.11.2"
description = "Durable native Codex follow-ups and visible session lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Cochran Research Group" }
]
dependencies = [
  "dbus-next>=0.2.3,<0.3",
  "websockets>=17,<18",
]

[project.scripts]
codex-wake = "codex_wake.cli:main"
codex-waked = "codex_wake.daemon:main"
codex-wake-hook = "codex_wake.hook:main"
codex-wake-github-webhook = "codex_wake.webhook_listener:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_wake = ["time_collect.ps1"]
