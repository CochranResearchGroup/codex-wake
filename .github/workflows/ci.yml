name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-gates:
    name: Release gates (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: python -m compileall -q src tests .codex/hooks

      - name: Check canonical policy wiring and pilot hashes
        run: python scripts/check_policy_wiring.py

      - name: Install declared dependencies for protocol tests
        run: python -m pip install '.[mcp]'

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'

      - name: Run OpenClaw plugin tests
        run: npm --prefix plugins/openclaw-codex-wake test

      - name: Check OpenClaw plugin entrypoints
        run: |
          node --check plugins/openclaw-codex-wake/index.js
          node --check plugins/openclaw-codex-wake/lib/scheduler.js

      - name: Build package
        run: |
          python -m venv /tmp/codex-wake-build
          /tmp/codex-wake-build/bin/python -m pip install --upgrade pip build
          /tmp/codex-wake-build/bin/python -m build

      - name: Install pinned schema-one compatibility package
        run: |
          git fetch --depth=1 origin 94e17a68e655d9e54ead6001704dc0ef453eb933
          mkdir /tmp/codex-wake-legacy-source
          git archive 94e17a68e655d9e54ead6001704dc0ef453eb933 | tar -x -C /tmp/codex-wake-legacy-source
          python -m venv /tmp/codex-wake-legacy-ci
          /tmp/codex-wake-legacy-ci/bin/python -m pip install /tmp/codex-wake-legacy-source

      - name: Smoke installed wheel
        run: |
          python -m venv /tmp/codex-wake-ci
          /tmp/codex-wake-ci/bin/python -m pip install --upgrade pip
          wake_wheels=(dist/*.whl)
          /tmp/codex-wake-ci/bin/python -m pip install "${wake_wheels[0]}[mcp]"

          /tmp/codex-wake-ci/bin/python scripts/source_registry_smoke.py --json
          /tmp/codex-wake-ci/bin/python scripts/session_discovery_smoke.py --cli /tmp/codex-wake-ci/bin/codex-wake
          /tmp/codex-wake-ci/bin/python scripts/a2a_mailbox_smoke.py --scheduler --operations --cli /tmp/codex-wake-ci/bin/codex-wake
          timeout 60s /tmp/codex-wake-ci/bin/python scripts/a2a_mcp_smoke.py --cli /tmp/codex-wake-ci/bin/codex-wake --mcp /tmp/codex-wake-ci/bin/codex-wake-mcp
          timeout 40s /tmp/codex-wake-ci/bin/python scripts/a2a_resource_qualification.py
          timeout 40s /tmp/codex-wake-ci/bin/python scripts/a2a_recovery_qualification.py --cli /tmp/codex-wake-ci/bin/codex-wake --legacy-python /tmp/codex-wake-legacy-ci/bin/python
          timeout 30s /tmp/codex-wake-ci/bin/python scripts/a2a_backup_qualification.py --cli /tmp/codex-wake-ci/bin/codex-wake --restore
          timeout 30s /tmp/codex-wake-ci/bin/python scripts/a2a_rollback_qualification.py --cli /tmp/codex-wake-ci/bin/codex-wake
          timeout 40s /tmp/codex-wake-ci/bin/python scripts/a2a_retention_qualification.py --cli /tmp/codex-wake-ci/bin/codex-wake --legacy-python /tmp/codex-wake-legacy-ci/bin/python
          PYTHONPATH=tests CODEX_WAKE_RECEIPT_CLI=/tmp/codex-wake-ci/bin/codex-wake /tmp/codex-wake-ci/bin/python -m unittest test_a2a_projection_ack -q

          python scripts/product_smoke.py \
            --codex-wake-bin /tmp/codex-wake-ci/bin/codex-wake \
            --codex-waked-bin /tmp/codex-wake-ci/bin/codex-waked \
            --artifact-dir /tmp/codex-wake-ci-artifacts \
            --upgrade-wheel dist/*.whl \
            --json

          /tmp/codex-wake-ci/bin/codex-waked --once --no-dispatch --wake-root /tmp/codex-wake-ci-empty

          hook_output="$(printf '{"prompt":"hello","cwd":"%s"}' "$PWD" | /tmp/codex-wake-ci/bin/codex-wake-hook)"
          test -z "$hook_output"

          /tmp/codex-wake-ci/bin/codex-wake --wake-root /tmp/codex-wake-ci-runtime \
            after --app-server-thread-id thread_ci_smoke 1m -- "CI smoke wake"
          /tmp/codex-wake-ci/bin/codex-wake --wake-root /tmp/codex-wake-ci-runtime list
